<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vermetricas — Grid Rectángulos Verticales V5</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090d0e}
  #stage{
    width:100%;
    height:100%;
    min-height:420px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 70%, rgba(255,255,255,.010), transparent 48%),
      #090d0e;
  }
  canvas{display:block;width:100%;height:100%}
  .fade{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(9,13,14,.16),transparent 8%,transparent 92%,rgba(9,13,14,.16)),
      linear-gradient(180deg,rgba(9,13,14,.08),transparent 12%,transparent 90%,rgba(9,13,14,.14));
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="fade"></div>
</div>

<script>
(()=>{
  const stage=document.getElementById('stage');
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');

  const COL={
  base:'#0E1018',
  low:'#181A2D',
  mid:'#5B5BF7',
  hot:'#A5A0FF'
};

  // V5: rectángulos más angostos
  const cfg={
    cols:8,
    rows:3,
    gapX:14,
    gapY:14,
    radius:2,
    cycle:4700,
    sourceRow:1.0,
    shadowX:7,
    shadowY:7,
    spread:2.5
  };

  let W=0,H=0,DPR=1;

  function resize(){
    const r=stage.getBoundingClientRect();
    W=r.width; H=r.height;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  const rgb=h=>{
    const n=parseInt(h.replace('#',''),16);
    return {r:n>>16,g:(n>>8)&255,b:n&255};
  };
  const base=rgb(COL.base), low=rgb(COL.low), mid=rgb(COL.mid), hot=rgb(COL.hot), white={r:255,g:255,b:255};

  const mix=(a,b,t)=>({
    r:Math.round(a.r+(b.r-a.r)*t),
    g:Math.round(a.g+(b.g-a.g)*t),
    b:Math.round(a.b+(b.b-a.b)*t)
  });
  const rgba=(c,a=1)=>`rgba(${c.r},${c.g},${c.b},${a})`;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=t=>t*t*(3-2*t);
  function travel(t){
    t%=1;
    return t<.5?smooth(t*2):smooth((1-t)*2);
  }

  function rounded(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);

    const padX=Math.max(18,W*.04);
    const padY=Math.max(18,H*.32);

    const usableW=W-padX*2;
    const usableH=H-padY*2;

    // más columnas + altura relativa mayor = rectángulos más angostos
    const cellW=(usableW-cfg.gapX*(cfg.cols-1))/cfg.cols;
    const rawCellH=(usableH-cfg.gapY*(cfg.rows-1))/cfg.rows;
    const cellH=Math.min(rawCellH, cellW*2.8);

    const gridW=cellW*cfg.cols + cfg.gapX*(cfg.cols-1);
    const gridH=cellH*cfg.rows + cfg.gapY*(cfg.rows-1);

    const startX=(W-gridW)/2;
    const startY=(H-gridH)/2;

    const t=(now%cfg.cycle)/cfg.cycle;
    const pos=.10+travel(t)*(cfg.cols-.20);
    const sourceX=startX+pos*(cellW+cfg.gapX);
    const sourceY=startY+(cfg.sourceRow+.50)*(cellH+cfg.gapY);

    const halo=ctx.createRadialGradient(sourceX,sourceY,0,sourceX,sourceY,cellW*6.0);
    halo.addColorStop(0,rgba(hot,.10));
    halo.addColorStop(.38,rgba(mid,.045));
    halo.addColorStop(1,rgba(mid,0));
    ctx.fillStyle=halo;
    ctx.fillRect(0,0,W,H);

    for(let r=0;r<cfg.rows;r++){
      for(let c=0;c<cfg.cols;c++){
        const x=startX+c*(cellW+cfg.gapX);
        const y=startY+r*(cellH+cfg.gapY);
        const cx=x+cellW/2, cy=y+cellH/2;

        const dx=(cx-sourceX)/(cellW+cfg.gapX);
        const dy=(cy-sourceY)/(cellH+cfg.gapY);
        const dist=Math.sqrt(dx*dx+dy*dy);

        let intensity=Math.exp(-(dist*dist)/(2*cfg.spread));
        intensity=Math.pow(intensity,1.04);

        const core=dist<.62;
        if(core) intensity=1;

        ctx.save();
        ctx.shadowColor='rgba(0,0,0,.72)';
        ctx.shadowBlur=10;
        rounded(x+cfg.shadowX,y+cfg.shadowY,cellW,cellH,cfg.radius);
        ctx.fillStyle='rgba(3,6,7,.95)';
        ctx.fill();
        ctx.restore();

        let vx=sourceX-cx, vy=sourceY-cy;
        const len=Math.hypot(vx,vy)||1;
        vx/=len; vy/=len;

        const reach=Math.max(cellW,cellH)*.70;
        const gx1=cx+vx*reach, gy1=cy+vy*reach;
        const gx2=cx-vx*reach, gy2=cy-vy*reach;

        const dark=mix(base,low,.34+intensity*.14);
        const lit=mix(low,mid,clamp(intensity*.86));
        const peak=mix(lit,hot,clamp((intensity-.24)*1.25));

        rounded(x,y,cellW,cellH,cfg.radius);
        const g=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
        g.addColorStop(0,rgba(core?hot:peak,.99));
        g.addColorStop(.34,rgba(lit,.99));
        g.addColorStop(1,rgba(dark,.995));
        ctx.fillStyle=g;
        ctx.fill();

        rounded(x,y,cellW,cellH,cfg.radius);
        const depth=ctx.createLinearGradient(x,y,x,y+cellH);
        depth.addColorStop(0,'rgba(255,255,255,.010)');
        depth.addColorStop(.70,'rgba(0,0,0,.03)');
        depth.addColorStop(1,'rgba(0,0,0,.22)');
        ctx.fillStyle=depth;
        ctx.fill();

        const edge=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
        edge.addColorStop(0,rgba(mix(mid,white,.20),.10+intensity*.20));
        edge.addColorStop(.18,'rgba(255,255,255,0)');
        edge.addColorStop(1,'rgba(255,255,255,0)');
        rounded(x+.45,y+.45,cellW-.9,cellH-.9,cfg.radius);
        ctx.strokeStyle=edge;
        ctx.lineWidth=.8;
        ctx.stroke();

        if(core){
          rounded(x,y,cellW,cellH,cfg.radius);
          const cg=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
          cg.addColorStop(0,rgba(mix(hot,white,.10),1));
          cg.addColorStop(.58,rgba(hot,1));
          cg.addColorStop(1,rgba(mix(mid,hot,.60),1));
          ctx.fillStyle=cg;
          ctx.shadowColor=rgba(hot,.30);
          ctx.shadowBlur=14;
          ctx.fill();
          ctx.shadowBlur=0;
        }
      }
    }
    requestAnimationFrame(draw);
  }

  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
